<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 145" width="100%" height="145" fill="none">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1524"/>
      <stop offset="100%" stop-color="#080c14"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f857a6"/>
      <stop offset="100%" stop-color="#ff5858"/>
    </linearGradient>
    <linearGradient id="accent3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#43e97b"/>
      <stop offset="100%" stop-color="#38f9d7"/>
    </linearGradient>
    <linearGradient id="accent4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fa709a"/>
      <stop offset="100%" stop-color="#fee140"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes pulseCard {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }
    .kpi-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #8b949e; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .kpi-value { font-family: 'Fira Code', 'JetBrains Mono', monospace; font-size: 24px; font-weight: 700; }
    .kpi-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; fill: #c9d1d9; font-weight: 500; }
  </style>

  <!-- Card 1 -->
  <g transform="translate(5, 5)">
    <rect width="200" height="135" rx="10" fill="url(#cardBg)" stroke="url(#accent1)" stroke-width="1.5"/>
    <text x="16" y="32" class="kpi-title">TerminalBench</text>
    <text x="16" y="70" class="kpi-value" fill="#00f2fe">L3 &amp; L4</text>
    <text x="16" y="96" class="kpi-sub">Engineering Contributor</text>
    <text x="16" y="116" fill="#38d39f" font-family="monospace" font-size="10.5">● Deterministic QC</text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(217, 5)">
    <rect width="200" height="135" rx="10" fill="url(#cardBg)" stroke="url(#accent2)" stroke-width="1.5"/>
    <text x="16" y="32" class="kpi-title">Red-Team Precision</text>
    <text x="16" y="70" class="kpi-value" fill="#ff5858">100%</text>
    <text x="16" y="96" class="kpi-sub">Stumped Frontier LLMs</text>
    <text x="16" y="116" fill="#f857a6" font-family="monospace" font-size="10.5">● 20+ Golden Rubrics</text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(429, 5)">
    <rect width="200" height="135" rx="10" fill="url(#cardBg)" stroke="url(#accent3)" stroke-width="1.5"/>
    <text x="16" y="32" class="kpi-title">BigQuery Optimization</text>
    <text x="16" y="70" class="kpi-value" fill="#43e97b">-35%</text>
    <text x="16" y="96" class="kpi-sub">Looker &amp; PLX Latency</text>
    <text x="16" y="116" fill="#38f9d7" font-family="monospace" font-size="10.5">● CSCD Mart Clustering</text>
  </g>

  <!-- Card 4 -->
  <g transform="translate(641, 5)">
    <rect width="200" height="135" rx="10" fill="url(#cardBg)" stroke="url(#accent4)" stroke-width="1.5"/>
    <text x="16" y="32" class="kpi-title">Data Lineage &amp; MDM</text>
    <text x="16" y="70" class="kpi-value" fill="#fee140">90K+</text>
    <text x="16" y="96" class="kpi-sub">Global Cloud Records</text>
    <text x="16" y="116" fill="#fa709a" font-family="monospace" font-size="10.5">● 12K+ Deprecated/Yr</text>
  </g>
</svg>
